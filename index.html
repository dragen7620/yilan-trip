<script>
// 宜蘭平原代表位置；僅用於兩日旅遊天氣的區域預報，不使用裝置定位。
const tripWeatherDates=[{date:'2026-12-05',label:'12/5（六）'},{date:'2026-12-06',label:'12/6（日）'}];
function taipeiToday(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const a=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
  return `${a.year}-${a.month}-${a.day}`;
}
function weatherCondition(code){
  const c=Number(code);
  if(c===0)return ['☀️','晴朗'];
  if(c===1)return ['🌤️','大致晴朗'];
  if(c===2)return ['⛅','多雲時晴'];
  if(c===3)return ['☁️','陰天'];
  if(c===45||c===48)return ['🌫️','有霧'];
  if([51,53,55,56,57].includes(c))return ['🌦️','毛毛雨'];
  if([61,63,65,66,67,80,81,82].includes(c))return ['🌧️','有雨'];
  if([71,73,75,77,85,86].includes(c))return ['🌨️','下雪'];
  if([95,96,99].includes(c))return ['⛈️','雷雨'];
  return ['🌤️','天氣多變'];
}
function showWeather(daily,message){
  const root=document.getElementById('weatherCards');root.replaceChildren();
  for(const target of tripWeatherDates){
    const day=document.createElement('div');day.className='weather-day';
    const date=document.createElement('div');date.className='weather-date';date.textContent=target.label;
    const desc=document.createElement('div');desc.className='weather-title';
    const meta=document.createElement('div');meta.className='weather-meta';
    const symbol=document.createElement('div');symbol.className='weather-symbol';
    const info=document.createElement('div');info.className='weather-copy';
    const i=daily?.time?.indexOf(target.date)??-1;
    if(i>=0&&Number.isFinite(daily.temperature_2m_max?.[i])&&Number.isFinite(daily.temperature_2m_min?.[i])){
      const [emoji,summary]=weatherCondition(daily.weather_code?.[i]);symbol.textContent=emoji;desc.textContent=summary;
      const hi=Math.round(daily.temperature_2m_max[i]);const lo=Math.round(daily.temperature_2m_min[i]);
      const rain=daily.precipitation_probability_max?.[i];
      meta.textContent=`${lo}–${hi}°C · 降雨機率 ${Number.isFinite(rain)?Math.round(rain)+'%':'暫無'}`;
    }else{symbol.textContent='📅';desc.textContent=message||'預報尚未提供';meta.textContent='請稍後再查看';}
    info.append(date,desc,meta);day.append(symbol,info);root.append(day);
  }
}
async function loadTripWeather(){
  const today=taipeiToday();
  const daysToTrip=Math.round((Date.parse(tripWeatherDates[0].date+'T00:00:00Z')-Date.parse(today+'T00:00:00Z'))/86400000);
  const footer=document.getElementById('weatherFoot');
  if(daysToTrip>15){showWeather(null,'預報尚未開放');footer.textContent='宜蘭地區預報 · 約出發前兩週可查看';return;}
  if(today>tripWeatherDates[1].date){showWeather(null,'旅遊日期已過');footer.textContent='旅遊日期已過，歷史天氣不在此頁顯示';return;}
  const url=new URL('https://api.open-meteo.com/v1/forecast');
  url.search=new URLSearchParams({latitude:'24.69',longitude:'121.77',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'Asia/Taipei',forecast_days:'16'}).toString();
  try{
    const response=await fetch(url.toString(),{cache:'no-store'});
    if(!response.ok)throw Error('Weather API '+response.status);
    const result=await response.json();
    if(!result.daily?.time)throw Error('Missing daily data');
    showWeather(result.daily,'預報尚未提供');
    footer.textContent='宜蘭地區預報 · 每次開啟網頁自動更新（實際天氣以當日為準）';
  }catch(e){showWeather(null,'暫時無法取得');footer.textContent='網路或天氣服務暫時無法使用，稍後重新整理即可';}
}
loadTripWeather();

const selection=['oldmama','sancheng','camellia','dongju','dingfeng','surewell','qifeng','eel','bird','wang','art','qianle'];
const labels={oldmama:'烤雞午餐',sancheng:'景點',camellia:'甜點外帶',dongju:'住宿',dingfeng:'火鍋晚餐',surewell:'超市採買',qifeng:'早餐可選',eel:'午餐首選',bird:'下午景點',wang:'三層坪備案',art:'雨天備案',qianle:'午餐備案'};
const short={oldmama:'招牌豆腐乳烤香雞',sancheng:'階梯農塘與落羽松',camellia:'法式甜點，外帶回民宿',dongju:'入住、下午茶與夜間聚會',dingfeng:'火鍋晚餐',surewell:'採購零食、飲料及早餐',qifeng:'脆皮飯糰，可外帶',eel:'鰻魚與鱸鰻料理、台式熱炒',bird:'鴨子生態體驗',wang:'湖畔散步，取代三層坪',art:'工藝藝術館，雨天可參觀',qianle:'海鮮料理，取代鰻晏'};
const p=selection.map(id=>places.find(x=>x.id===id)).filter(Boolean);
const steps1=[['08:30','台北出發'],['11:30','蘭陽老媽媽｜午餐'],['13:30','三層坪（備案：望龍埤）'],['15:45','Camellia｜甜點外帶'],['16:30','東居民宿｜入住、下午茶'],['18:30','鼎楓寶島火鍋'],['20:10','喜互惠順安店｜零食採買'],['21:00','民宿聚會']];
const steps2=[['09:00','民宿早餐／奇峰豆漿外帶'],['10:00','整理行李、退房'],['11:45','鰻晏｜午餐（備案：千樂水產）'],['13:45','甲鳥園（雨備：呂美麗精雕藝術館）'],['15:00','返回台北']];
function renderDay(id,steps){document.getElementById(id).innerHTML=steps.map(([t,v])=>`<div class="event"><span class="time">${t}</span><span class="ename">${v}</span></div>`).join('')}
renderDay('day1',steps1);renderDay('day2',steps2);
function gmap(x){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.name+' '+x.address+' 台灣')}
function markerFilter(x,f){return f==='all'||(f==='alt'?x.day==='alt':x.day===f||x.day==='both')}
function renderCards(f){document.getElementById('cards').innerHTML=p.filter(x=>markerFilter(x,f)).map(x=>`<article class="place"><div class="top"><h3><span class="emoji">${x.emoji}</span> ${x.name}</h3><span class="badge ${x.day==='alt'?'alt':''}">${labels[x.id]}</span></div><p class="desc">${short[x.id]}</p><div class="details"><span>📍 ${x.address}</span><span>☎ ${/^\d/.test(x.phone)?`<a class="phone" href="tel:${x.phone.replace(/[^\d+]/g,'')}">${x.phone}</a>`:x.phone}</span><span>🕒 ${x.hours}</span></div><a class="maplink" target="_blank" rel="noopener" href="${gmap(x)}">📍 Google Maps 定位</a></article>`).join('')}
let current='all';renderCards(current);
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));renderCards(current);filterPins()}));
const status=document.getElementById('mapStatus');let map, allMarkers=[];
async function initMap(){if(typeof L==='undefined'){status.textContent='地圖暫時無法載入，請點下方的 Google Maps 定位。';return}map=L.map('map',{scrollWheelZoom:false}).setView([24.68,121.75],10);// 改用 Esri 街道底圖，避免 OSM 標準圖磚回傳 403 封鎖畫面。
const baseLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:18,
  attribution:'Tiles &copy; Esri — Sources: Esri, HERE, Garmin, USGS, OpenStreetMap contributors, and the GIS User Community',
  errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='
}).addTo(map);
let tileErrors=0, tileLoads=0;
baseLayer.on('tileload',()=>{tileLoads++; if(tileLoads>0 && tileErrors<=2 && status.dataset.tileError==='1'){status.textContent='點地圖圖釘可開啟 Google Maps';status.dataset.tileError='';}});
baseLayer.on('tileerror',()=>{tileErrors++; if(tileErrors>=4 && tileLoads===0){
  status.dataset.tileError='1';
  status.textContent='地圖底圖暫時無法載入，請使用下方各地點的 Google Maps 定位。';
}});// 使用固定地理座標，避免公開地理編碼服務限流造成部分圖釘消失。
// 其中「概略」圖釘僅供宜蘭地點分布瀏覽；定位導航始終使用店名＋地址的 Google Maps 搜尋。
const fixedPoints = {
 oldmama: {lat:24.780408, lon:121.696308}, // 飯店旅遊平台公開店址座標
 sancheng: {lat:24.783851, lon:121.681146}, // 網友記錄的園區 GPS
 camellia: {lat:24.627456, lon:121.746289}, // 旅遊平台公開座標
 dongju: {lat:24.6419, lon:121.7350, approximate:true}, // 冬山梅花湖周邊概略位置
 dingfeng: {lat:24.6577, lon:121.7659, approximate:true}, // 冬山清溝一帶概略位置
 surewell: {lat:24.65549, lon:121.76199}, // OSM 順安店超市
 qifeng: {lat:24.6315, lon:121.7935, approximate:true}, // 冬山市區概略位置
 eel: {lat:24.7102, lon:121.7165, approximate:true}, // 員山深溝餐廳附近概略位置
 bird: {lat:24.790919, lon:121.7500005}, // Google Maps 地點座標
 wang: {lat:24.775544, lon:121.699032}, // VR 景點公開座標
 art: {lat:24.81550, lon:121.78386}, // OSM 藝術館座標
 qianle: {lat:24.6515, lon:121.7725, approximate:true} // 冬山義成路一帶概略位置
};
for(const x of p){
 const c=fixedPoints[x.id];
 if(!c||!Number.isFinite(c.lat)||!Number.isFinite(c.lon)) continue;
 const ico=L.divIcon({html:`<span title="${x.name}" style="background:white;border:2px solid ${x.day==='alt'?'#bd9559':'#2b6256'};border-radius:50%;width:33px;height:33px;display:grid;place-items:center;box-shadow:0 1px 8px #0004">${x.emoji}</span>`,className:'',iconSize:[33,33],iconAnchor:[16,16]});
 const m=L.marker([c.lat,c.lon],{icon:ico}).bindPopup(`<b>${x.name}</b>${c.approximate?'<br><small>圖釘為區域概略位置</small>':''}<br><a href="${gmap(x)}" target="_blank" rel="noopener">Google Maps 精確搜尋／導航 ↗</a>`);
 allMarkers.push({m,x});
}
if(status.dataset.tileError!=='1') status.textContent=`已標示 ${allMarkers.length}/${p.length} 處 · 點圖釘開啟 Google Maps（部分圖釘為概略位置）`;
filterPins();}
function filterPins(){if(!map)return;const b=[];for(const {m,x} of allMarkers){if(markerFilter(x,current)){m.addTo(map);b.push(m.getLatLng())}else map.removeLayer(m)}if(b.length)map.fitBounds(L.latLngBounds(b).pad(.2),{maxZoom:12})}
initMap();
</script></body></html>
